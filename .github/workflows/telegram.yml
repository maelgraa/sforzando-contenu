name: Telegram

# Après chaque publication (articles.json ou bulletins.json modifiés sur main),
# envoie le résumé des nouveautés sur la chaîne Telegram de tempo730.
on:
  push:
    branches: [main]
    paths: [articles.json, bulletins.json]

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/telegram.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          AVANT: ${{ github.event.before }}
